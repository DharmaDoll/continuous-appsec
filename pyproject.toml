[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "whitebox-ai-audit"
version = "0.1.0.dev0"
description = "Evidence-driven white-box AppSec audit harness"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Whitebox AI Audit contributors" }]
dependencies = [
  "PyYAML==6.0.3",
]

[project.scripts]
whitebox-audit = "whitebox_audit.cli:entrypoint"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whitebox_audit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
